<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snipify</title><link rel="stylesheet" href="styles.css"></head><body><main><section class="hero"><span class="badge">SERVERLESS URL SHORTENER</span><h1>Snipify</h1><p>Turn long links into clean, shareable URLs.</p></section><section class="card"><form id="form"><label for="url">Long URL</label><input id="url" type="url" placeholder="https://example.com/a/very/long/link" required><label for="days">Expires in</label><select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">1 year</option></select><button>Shorten URL</button></form><div id="message" role="status"></div><div id="result" hidden><label>Your Snipify link</label><div class="result-row"><input id="shortUrl" readonly><button id="copy" type="button">Copy</button></div></div></section><footer>Java 21 · AWS Lambda · DynamoDB · ElastiCache Serverless · S3</footer></main><script src="config.js"></script><script src="app.js"></script></body></html>
